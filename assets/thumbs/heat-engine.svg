<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="고온 열원에서 열기관을 거쳐 저온 열원으로 가는 에너지 흐름과 두 열기관의 순환 그래프">
  <rect width="320" height="180" fill="#eef1fb"/>
  <text x="160" y="26" text-anchor="middle" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="700" fill="#1b1f27">e = W / Q₁</text>

  <!-- 에너지 흐름 -->
  <rect x="24" y="40" width="96" height="22" rx="4" fill="#dc3f45"/>
  <rect x="24" y="146" width="96" height="22" rx="4" fill="#2f7fd6"/>
