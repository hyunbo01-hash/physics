<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="피스톤이 달린 실린더 속 기체와 압력-부피 그래프">
  <rect width="320" height="180" fill="#eef1fb"/>
  <text x="160" y="30" text-anchor="middle" font-family="'IBM Plex Mono', Consolas, monospace" font-size="17" font-weight="600" fill="#1b1f27"><tspan fill="#dc3f45">Q</tspan> = <tspan fill="#7a55d6">ΔU</tspan> + <tspan fill="#12925f">W</tspan></text>

  <!-- 실린더와 기체 -->
  <rect x="24" y="58" width="88" height="60" fill="#f6c9cb"/>
  <g fill="#dc3f45">
    <circle cx="36" cy="70" r="3.5"/><circle cx="52" cy="98" r="3.5"/><circle cx="64" cy="74" r="3.5"/>
    <circle cx="78" cy="106" r="3.5"/><circle cx="88" cy="82" r="3.5"/><circle cx="42" cy="108" r="3.5"/>
    <circle cx="100" cy="66" r="3.5"/><circle cx="72" cy="90" r="3.5"/><circle cx="98" cy="102" r="3.5"/>
    <circle cx="48" cy="82" r="3.5"/>
  </g>
  <path d="M176 58H24v60h152" fill="none" stroke="#1b1f27" stroke-width="3" stroke-linejoin="round"/>
  <rect x="124" y="83" width="56" height="10" fill="#626a77"/>
  <rect x="112" y="60" width="12" height="56" fill="#1b1f27"/>

  <!-- 일: 피스톤을 미는 방향 -->
  <g stroke="#12925f" stroke-width="4" stroke-linecap="round" fill="#12925f">
    <path d="M132 71h22"/>
    <path d="M164 71l-10-6v12z" stroke="none"/>
  </g>

  <!-- 열: 아래에서 기체로 -->
  <g stroke="#dc3f45" stroke-width="4" stroke-linecap="round" fill="#dc3f45">
    <path d="M46 150v-14M68 150v-14M90 150v-14"/>
    <path d="M46 126l-6 10h12zM68 126l-6 10h12zM90 126l-6 10h12z" stroke="none"/>
  </g>

  <!-- 압력-부피 그래프 -->
  <path d="M230 142V93.5L246 106.7L266 116V142z" fill="#12925f" fill-opacity="0.3"/>
  <path d="M204 48v94h96" fill="none" stroke="#1b1f27" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M212 56Q224 112 292 122" fill="none" stroke="#626a77" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M230 93.5Q240 108 266 116" fill="none" stroke="#3453d1" stroke-width="4" stroke-linecap="round"/>
  <circle cx="230" cy="93.5" r="5" fill="#eef1fb" stroke="#3453d1" stroke-width="2.5"/>
  <circle cx="266" cy="116" r="5.5" fill="#3453d1"/>
  <g font-family="'IBM Plex Sans KR', 'Malgun Gothic', sans-serif" font-size="12" fill="#626a77">
    <text x="194" y="56" text-anchor="end">P</text>
    <text x="300" y="158" text-anchor="end">V</text>
  </g>
</svg>
