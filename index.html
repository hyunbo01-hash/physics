<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="수업에서 쓰는 시뮬레이션과 보조 자료를 모아 두는 곳">
<title>물리 수업 자료실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 실험 노트의 목차처럼 — 왼쪽에 차시 코드, 가운데 차시 제목, 오른쪽에 그 차시의 자료. 한 단, 최대 60rem. */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --ink: #1b1f27;
  --muted: #626a77;
  --line: #dfe3ea;
  --accent: #3453d1;
  --accent-soft: #e8ecfb;
  --mark: #b45309;

  --font-display: "Gothic A1", "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --font-body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --font-code: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161b; --surface: #1d2027; --ink: #eceef2; --muted: #9aa2ae;
    --line: #30343e; --accent: #8098ff; --accent-soft: #252c47; --mark: #f0b45c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14161b; --surface: #1d2027; --ink: #eceef2; --muted: #9aa2ae;
  --line: #30343e; --accent: #8098ff; --accent-soft: #252c47; --mark: #f0b45c;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.6;
  word-break: keep-all;
}
.page {
  max-width: 60rem;
  margin-inline: auto;
  padding-inline: 1.25rem;
  padding-block: 2rem 3rem;
  display: flex;
  flex-direction: column;
  gap: 1.75rem;
}
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* 머리말 */
.masthead { display: flex; flex-direction: column; gap: 0.5rem; }
.term {
  font-family: var(--font-code);
  font-size: 0.8125rem;
  color: var(--muted);
  letter-spacing: 0.04em;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(1.75rem, 5vw, 2.5rem);
  line-height: 1.2;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.tagline { margin: 0; color: var(--muted); }
#wave { display: block; width: 100%; height: 3.5rem; margin-top: 0.5rem; }

/* 과목 탭 */
.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  border-bottom: 1px solid var(--line);
  padding-bottom: 0.75rem;
}
.tab {
  font: inherit;
  font-weight: 500;
  color: var(--muted);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 999px;
  padding: 0.375rem 0.875rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
}
.tab:hover { color: var(--ink); border-color: var(--line); }
.tab[aria-selected="true"] { color: var(--surface); background: var(--ink); }
.tab .n { font-family: var(--font-code); font-size: 0.75rem; opacity: 0.75; }

/* 검색·종류 */
.tools { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
#q {
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 0.5rem 0.75rem;
  flex: 1 1 14rem;
  min-width: 0;
}
.chips { display: flex; flex-wrap: wrap; gap: 0.375rem; }
.chip {
  font: inherit;
  font-size: 0.875rem;
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 0.3125rem 0.625rem;
  cursor: pointer;
}
.chip[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

.summary { margin: 0; color: var(--muted); font-size: 0.875rem; font-variant-numeric: tabular-nums; }

/* 단원과 차시 */
#shelf { display: flex; flex-direction: column; gap: 2rem; }
.unit { display: flex; flex-direction: column; gap: 0.75rem; }
.unit h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.25rem;
  display: flex;
  align-items: baseline;
  gap: 0.625rem;
}
.unit h2 .roman { font-family: var(--font-code); font-weight: 500; color: var(--accent); min-width: 1.75rem; }
.lessons {
  list-style: none;
  margin: 0;
  padding: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
}
.lesson {
  display: grid;
  grid-template-columns: 5.5rem minmax(0, 1fr) minmax(0, 1.2fr);
  gap: 0.25rem 1rem;
  align-items: baseline;
  padding: 0.75rem 1rem;
}
.lesson + .lesson { border-top: 1px solid var(--line); }
.code { font-family: var(--font-code); font-size: 0.8125rem; color: var(--muted); }
.lesson-title { font-weight: 500; min-width: 0; }
.lesson.empty .lesson-title { color: var(--muted); font-weight: 400; }
.materials { display: flex; flex-direction: column; gap: 0.375rem; min-width: 0; }
.pending { color: var(--muted); font-size: 0.875rem; }
.material {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.25rem 0.5rem;
  text-decoration: none;
  color: var(--ink);
}
.material .kind {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 4px;
  padding: 0.0625rem 0.375rem;
  white-space: nowrap;
}
.material .name { font-weight: 600; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 0.2em; }
.material:hover .name { text-decoration-color: var(--accent); color: var(--accent); }
.material .desc { flex-basis: 100%; color: var(--muted); font-size: 0.875rem; }
.material .new { font-size: 0.75rem; font-weight: 600; color: var(--mark); }

/* 자료 카드 */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); gap: 1rem; }
.card {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  text-decoration: none;
  color: var(--ink);
  min-width: 0;
}
.card:hover { border-color: var(--accent); }
.card .thumb { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: var(--accent-soft); border-bottom: 1px solid var(--line); }
.card-body { display: flex; flex-direction: column; gap: 0.25rem; padding: 0.75rem 1rem 1rem; }
.card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
.card .kind { font-size: 0.75rem; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0.0625rem 0.375rem; }
.card .new { font-size: 0.75rem; font-weight: 600; color: var(--mark); }
.card-title { font-family: var(--font-display); font-weight: 800; font-size: 1.125rem; line-height: 1.3; }
.card:hover .card-title { color: var(--accent); }
.card .desc { color: var(--muted); font-size: 0.875rem; }

.blank {
  background: var(--surface);
  border: 1px dashed var(--line);
  border-radius: 8px;
  padding: 2rem 1.25rem;
  color: var(--muted);
  text-align: center;
}
.blank strong { display: block; color: var(--ink); font-weight: 600; margin-bottom: 0.25rem; }

footer { color: var(--muted); font-size: 0.8125rem; border-top: 1px solid var(--line); padding-top: 1rem; }

@media (max-width: 40rem) {
  .lesson { grid-template-columns: 4.75rem minmax(0, 1fr); }
  .materials { grid-column: 2; }
}
</style>
</head>
<body>

<div class="page">
  <header class="masthead">
    <span class="term" id="term"></span>
    <h1 id="site-name">물리 수업 자료실</h1>
    <p class="tagline" id="tagline"></p>
    <canvas id="wave" aria-hidden="true"></canvas>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="과목"></nav>

  <div class="tools" id="tools" hidden>
    <input id="q" type="search" placeholder="자료 이름으로 찾기" aria-label="자료 이름으로 찾기" autocomplete="off">
    <div class="chips" id="chips" role="group" aria-label="자료 종류"></div>
  </div>

  <p class="summary" id="summary"></p>
  <main id="shelf"></main>

  <footer id="foot"></footer>
</div>

<script src="data.js?v=3"></script>
<script>
(function () {
  var S = window.SITE;
  var shelf = document.getElementById("shelf");

  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "text") el.textContent = attrs[k];
      else el.setAttribute(k, attrs[k]);
    });
    for (var i = 2; i < arguments.length; i++) if (arguments[i]) el.appendChild(arguments[i]);
    return el;
  }

  if (!S) {
    shelf.appendChild(h("div", { class: "blank" },
      h("strong", { text: "자료 목록을 불러오지 못했습니다" }),
      h("span", { text: "index.html 과 같은 폴더에 data.js 가 있는지 확인해 주세요." })));
    return;
  }

  document.getElementById("site-name").textContent = S.name;
  document.getElementById("tagline").textContent = S.tagline || "";
  document.getElementById("term").textContent = S.term || "";
  document.getElementById("foot").textContent = S.name + " · " + (S.term || "");

  var items = S.items || [];
  var state = { subject: null, type: null, q: "" };

  function known(id) { return S.subjects.some(function (s) { return s.id === id; }); }
  function remembered() {
    try { return localStorage.getItem("subject"); } catch (e) { return null; }
  }
  var fromHash = location.hash.replace("#", "");
  state.subject = known(fromHash) ? fromHash : known(remembered()) ? remembered() : S.subjects[0].id;

  function isNew(it) {
    if (!it.added) return false;
    var days = (Date.now() - new Date(it.added).getTime()) / 86400000;
    return days >= 0 && days <= 14;
  }

  function matches(it) {
    if (state.type && it.type !== state.type) return false;
    if (state.q && (it.title + " " + (it.desc || "")).toLowerCase().indexOf(state.q) === -1) return false;
    return true;
  }

  function materialLink(it) {
    return h("a", { class: "material", href: it.href },
      h("span", { class: "kind", text: S.types[it.type] || it.type }),
      h("span", { class: "name", text: it.title }),
      isNew(it) ? h("span", { class: "new", text: "새로 올림" }) : null,
      it.desc ? h("span", { class: "desc", text: it.desc }) : null);
  }

  function card(it) {
    return h("a", { class: "card", href: it.href },
      it.thumb ? h("img", { class: "thumb", src: it.thumb, alt: "", loading: "lazy" }) : h("div", { class: "thumb" }),
      h("div", { class: "card-body" },
        h("div", { class: "card-meta" },
          h("span", { class: "kind", text: S.types[it.type] || it.type }),
          it.lesson ? h("span", { class: "code", text: it.lesson }) : null,
          isNew(it) ? h("span", { class: "new", text: "새로 올림" }) : null),
        h("span", { class: "card-title", text: it.title }),
        it.desc ? h("span", { class: "desc", text: it.desc }) : null));
  }

  function lessonRow(code, title, list) {
    var mats = h("div", { class: "materials" });
    if (list.length) list.forEach(function (it) { mats.appendChild(materialLink(it)); });
    else mats.appendChild(h("span", { class: "pending", text: "준비 중" }));
    return h("li", { class: "lesson" + (list.length ? "" : " empty") },
      h("span", { class: "code", text: code }),
      h("span", { class: "lesson-title", text: title }),
      mats);
  }

  function renderTabs() {
    var tabs = document.getElementById("tabs");
    tabs.textContent = "";
    S.subjects.forEach(function (s) {
      var n = items.filter(function (it) { return it.subject === s.id; }).length;
      var b = h("button", { class: "tab", type: "button", role: "tab", id: "tab-" + s.id,
        "aria-selected": String(s.id === state.subject) },
        h("span", { text: s.name }),
        h("span", { class: "n", text: String(n) }));
      b.addEventListener("click", function () {
        state.subject = s.id;
        try { localStorage.setItem("subject", s.id); } catch (e) {}
        try { history.replaceState(null, "", "#" + s.id); } catch (e) {}
        renderTabs(); renderShelf();
      });
      tabs.appendChild(b);
    });
  }

  function renderChips() {
    var chips = document.getElementById("chips");
    chips.textContent = "";
    Object.keys(S.types).forEach(function (t) {
      if (!items.some(function (it) { return it.type === t; })) return;
      var b = h("button", { class: "chip", type: "button", id: "chip-" + t,
        "aria-pressed": String(state.type === t), text: S.types[t] });
      b.addEventListener("click", function () {
        state.type = state.type === t ? null : t;
        renderChips(); renderShelf();
      });
      chips.appendChild(b);
    });
  }

  function renderShelf() {
    var subj = S.subjects.filter(function (s) { return s.id === state.subject; })[0];
    var mine = items.filter(function (it) { return it.subject === subj.id; });
    var shown = mine.filter(matches);
    var filtering = !!(state.type || state.q);
    var lessonCount = 0, placed = {};
    shelf.textContent = "";

    (subj.units || []).forEach(function (u) {
      var ol = h("ol", { class: "lessons" });
      u.lessons.forEach(function (l) {
        lessonCount++;
        var list = shown.filter(function (it) { return it.lesson === l.code; });
        list.forEach(function (it) { placed[items.indexOf(it)] = true; });
        if (filtering && !list.length) return;
        ol.appendChild(lessonRow(l.code, l.title, list));
      });
      if (!ol.children.length) return;
      shelf.appendChild(h("section", { class: "unit" },
        h("h2", null, h("span", { class: "roman", text: u.code }), h("span", { text: u.title })),
        ol));
    });

    var rest = shown.filter(function (it) { return !placed[items.indexOf(it)]; });
    if (rest.length) {
      var grid = h("div", { class: "cards" });
      rest.forEach(function (it) { grid.appendChild(card(it)); });
      var sec = h("section", { class: "unit" });
      if (subj.units && subj.units.length) sec.appendChild(h("h2", null, h("span", { text: "기타 자료" })));
      sec.appendChild(grid);
      shelf.appendChild(sec);
    }

    if (!shelf.children.length) {
      shelf.appendChild(filtering
        ? h("div", { class: "blank" },
            h("strong", { text: "조건에 맞는 자료가 없습니다" }),
            h("span", { text: "검색어나 종류 선택을 바꿔 보세요." }))
        : h("div", { class: "blank" },
            h("strong", { text: "아직 올린 자료가 없습니다" }),
            h("span", { text: subj.name + " 자료가 준비되면 이곳에 나타납니다." })));
    }

    var parts = [subj.name];
    if (lessonCount) parts.push("차시 " + lessonCount + "개");
    parts.push("자료 " + (filtering ? shown.length + " / " + mine.length : mine.length) + "개");
    document.getElementById("summary").textContent = parts.join(" · ");
  }

  document.getElementById("tools").hidden = items.length === 0;
  document.getElementById("q").addEventListener("input", function (e) {
    state.q = e.target.value.trim().toLowerCase();
    renderShelf();
  });
  renderTabs(); renderChips(); renderShelf();

  /* 머리말의 정상파: 양 끝이 고정된 줄의 3배 진동 */
  var cv = document.getElementById("wave");
  var ctx = cv.getContext("2d");
  var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function draw(ms) {
    var w = cv.clientWidth, hgt = cv.clientHeight, dpr = window.devicePixelRatio || 1;
    if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(hgt * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, hgt);
    var css = getComputedStyle(document.documentElement);
    var accent = css.getPropertyValue("--accent").trim(), line = css.getPropertyValue("--line").trim();
    var n = 3, pad = 6, L = w - pad * 2, mid = hgt / 2, A = hgt / 2 - 6;
    var phase = still ? 1 : Math.cos(ms / 700);
    function curve(amp) {
      ctx.beginPath();
      for (var x = 0; x <= L; x += 2) {
        var y = mid - amp * Math.sin(n * Math.PI * x / L);
        if (x === 0) ctx.moveTo(pad + x, y); else ctx.lineTo(pad + x, y);
      }
      ctx.stroke();
    }
    ctx.lineWidth = 1; ctx.strokeStyle = line;
    curve(A); curve(-A);
    ctx.lineWidth = 2; ctx.strokeStyle = accent;
    curve(A * phase);
    ctx.fillStyle = accent;
    for (var i = 0; i <= n; i++) {
      ctx.beginPath(); ctx.arc(pad + L * i / n, mid, 3, 0, Math.PI * 2); ctx.fill();
    }
    if (!still) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  if (still) window.addEventListener("resize", function () { requestAnimationFrame(draw); });
})();
</script>
</body>
</html>
