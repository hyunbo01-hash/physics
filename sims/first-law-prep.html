<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function mk(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  /* 차가움(파랑) → 뜨거움(빨강), t 는 0~1 */
  function tcol(t, a) {
    t = Math.max(0, Math.min(1, t));
    return "rgba(" + Math.round(59 + 180 * t) + "," + Math.round(130 - 62 * t) + "," + Math.round(246 - 178 * t) + "," + a + ")";
  }
  function arr(x1, y1, x2, y2, col, w) {
    var a = Math.atan2(y2 - y1, x2 - x1), h = 8 + w;
    return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + (x2 - Math.cos(a) * h * 0.7) + '" y2="' + (y2 - Math.sin(a) * h * 0.7) + '" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round"/>' +
      '<path d="M' + x2 + ' ' + y2 + 'L' + (x2 - h * Math.cos(a - 0.5)) + ' ' + (y2 - h * Math.sin(a - 0.5)) + 'L' + (x2 - h * Math.cos(a + 0.5)) + ' ' + (y2 - h * Math.sin(a + 0.5)) + 'z" fill="' + col + '"/>';
  }
  function svg(label, body) { return '<svg viewBox="0 0 360 200" role="img" aria-label="' + label + '" font-size="14">' + body + '</svg>'; }
  function txt(x, y, s, fill, anchor, bold) {
    return '<text x="' + x + '" y="' + y + '" fill="' + (fill || "var(--ink)") + '" text-anchor="' + (anchor || "start") + '"' + (bold ? ' font-weight="600"' : "") + '>' + s + '</text>';
  }
  var uid = 0;
  function slider(parent, label, min, max, step, val, fmt, on) {
    var id = "s" + (++uid), wrap = mk("div", "ctl"), head = mk("div", "slider-head"), lb = mk("label", "", label), o = mk("span", "num"), inp = mk("input");
    lb.htmlFor = id; inp.type = "range"; inp.id = id; inp.min = min; inp.max = max; inp.step = step; inp.value = val;
    head.appendChild(lb); head.appendChild(o); wrap.appendChild(head); wrap.appendChild(inp); parent.appendChild(wrap);
    function f() { var v = parseFloat(inp.value); o.textContent = fmt(v); on(v); }
    inp.addEventListener("input", f); f();
  }
  function choice(parent, label, opts, val, on) {
    var wrap = mk("div", "ctl"), seg = mk("div", "seg");
    wrap.appendChild(mk("span", "ctl-label", label)); seg.setAttribute("role", "tablist"); seg.setAttribute("aria-label", label);
    opts.forEach(function (o, i) {
      var b = mk("button", "", o); b.type = "button"; b.id = "c" + (++uid); b.setAttribute("role", "tab"); b.setAttribute("aria-selected", String(i === val));
      b.addEventListener("click", function () {
        Array.prototype.forEach.call(seg.children, function (c, j) { c.setAttribute("aria-selected", String(j === i)); });
        on(i);
      });
      seg.appendChild(b);
    });
    wrap.appendChild(seg); parent.appendChild(wrap);
  }
  /* 결과 칸: 항목 {n 이름, v 값, key 강조, c 색 이름, bar 0~1}, 문자열은 연산 기호, "br" 은 줄바꿈 */
  function tiles(out, items, note) {
    out.textContent = "";
    var row = mk("div", "rtiles");
    items.forEach(function (it) {
      if (it === "br") { row.appendChild(mk("div", "rbr")); return; }
      if (typeof it === "string") { var op = mk("span", "rop", it); op.setAttribute("aria-hidden", "true"); row.appendChild(op); return; }
      var t = mk("div", "rt" + (it.key ? " key" : ""));
      t.style.setProperty("--c", "var(--" + (it.c || "accent") + ")");
      t.appendChild(mk("span", "nm", it.n)); t.appendChild(mk("span", "v", it.v));
      if (it.bar !== undefined) {
        var b = mk("div", "rbar"), f = mk("div");
        f.style.width = Math.max(2, Math.min(100, it.bar * 100)) + "%";
        b.appendChild(f); t.appendChild(b);
      }
      row.appendChild(t);
    });
    out.appendChild(row);
    if (note) out.appendChild(mk("p", "note", note));
  }
  var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue("--" + n).trim(); }

  /* 움직이는 기체 분자를 그리는 캔버스 */
  function gasCanvas(fig, label) {
    var cv = mk("canvas"), parts = [];
    cv.setAttribute("role", "img"); cv.setAttribute("aria-label", label);
    fig.appendChild(cv);
    for (var i = 0; i < 40; i++) parts.push({ u: Math.random(), v: Math.random(), a: Math.random() * 6.283 });
    return {
      begin: function () {
        var w = cv.clientWidth, h = cv.clientHeight, dpr = window.devicePixelRatio || 1;
        if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
        var c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
        return { c: c, w: w, h: h };
      },
      /* (x, y) 에서 폭 bw, 높이 bh 인 기체 영역에 분자를 그린다 */
      gas: function (c, x, y, bw, bh, T, dt, n) {
        var t = (T - 100) / 500, sp = 110 * Math.sqrt(T / 300);
        c.fillStyle = tcol(t, 0.16); c.fillRect(x, y, bw, bh);
        c.fillStyle = tcol(t, 1);
        parts.forEach(function (p, i) {
          if (n !== undefined && i >= n) return;
          if (!still) {
            p.u += Math.cos(p.a) * sp * dt / Math.max(20, bw); p.v += Math.sin(p.a) * sp * dt / Math.max(20, bh);
            if (p.u < 0) { p.u = -p.u; p.a = Math.PI - p.a; } if (p.u > 1) { p.u = 2 - p.u; p.a = Math.PI - p.a; }
            if (p.v < 0) { p.v = -p.v; p.a = -p.a; } if (p.v > 1) { p.v = 2 - p.v; p.a = -p.a; }
            p.u = Math.max(0, Math.min(1, p.u)); p.v = Math.max(0, Math.min(1, p.v));
          }
          c.beginPath(); c.arc(x + 7 + p.u * Math.max(1, bw - 14), y + 7 + p.v * Math.max(1, bh - 14), 4.5, 0, 6.283); c.fill();
        });
      }
    };
  }

  var C = [
    {
      nm: "온도", t: "온도와 분자 운동",
      law: "Eₖ ∝ T",
      core: "절대 온도는 기체 분자의 평균 운동 에너지에 비례한다.",
      pts: ["기체 분자는 끊임없이 무작위로 움직이며 벽과 충돌한다. 이 운동을 열운동이라고 한다.", "온도가 높을수록 분자가 평균적으로 더 빠르게 움직인다.", "절대 온도(K) = 섭씨온도(°C) + 273"],
      link: "다음 개념에서: 기체 분자들의 운동 에너지를 모두 더하면 내부 에너지가 된다.",
      quiz: { q: "절대 온도가 300 K에서 600 K가 되면 기체 분자의 평균 운동 에너지는?", opts: ["2배가 된다", "4배가 된다", "변하지 않는다"], ans: 0, why: "평균 운동 에너지는 절대 온도에 비례하므로 온도가 2배이면 2배가 된다." },
      init: function (fig, ctl, out) {
        var s = { T: 300 }, g = gasCanvas(fig, "상자 속에서 움직이는 기체 분자");
        slider(ctl, "절대 온도", 100, 600, 10, 300, function (v) { return v + " K"; }, function (v) {
          s.T = v;
          tiles(out, [{ n: "절대 온도 T", v: v + " K" }, "→", { n: "분자의 평균 운동 에너지", v: (v / 300).toFixed(1) + "배", key: true, bar: v / 600 }],
            "300 K 일 때를 1배로 놓고 비교한 값");
        });
        return function (dt) {
          var f = g.begin(), c = f.c;
          g.gas(c, 4, 4, f.w - 8, f.h - 8, s.T, dt);
          c.strokeStyle = cssVar("ink"); c.lineWidth = 3; c.strokeRect(4, 4, f.w - 8, f.h - 8);
        };
      }
    },
    {
      nm: "내부 에너지", t: "내부 에너지",
      law: "U = 분자 운동 에너지의 총합",
      core: "이상 기체의 내부 에너지는 온도만으로 정해진다. 온도가 오르면 U 가 커지고, 온도가 그대로면 U 도 그대로이다.",
      pts: ["기체 분자의 무작위 운동(열운동)에 의한 운동 에너지를 모두 더한 것을 내부 에너지 U 라고 한다.", "같은 기체라면 분자 수가 많을수록, 온도가 높을수록 내부 에너지가 크다.", "이상 기체는 분자 사이의 힘을 무시하므로, 양이 정해진 기체의 내부 에너지는 온도에만 관계한다. 부피만 바뀌고 온도가 같으면 U 도 같다.", "기체를 가열하거나 기체에 일을 해 주면 내부 에너지가 증가한다."],
      link: "제1법칙에서: ΔU > 0 이면 온도가 올라간 것이고, 등온 과정처럼 온도가 그대로이면 ΔU = 0 이다.",
      quiz: { q: "같은 양의 이상 기체가 온도는 그대로이고 부피만 2배가 되었다. 내부 에너지는?", opts: ["변하지 않는다", "2배가 된다", "절반이 된다"], ans: 0, why: "이상 기체의 내부 에너지는 온도에만 관계하므로, 온도가 같으면 부피가 변해도 내부 에너지는 같다." },
      init: function (fig, ctl, out) {
        var s = { T: 300, N: 20, V: 1 }, g = gasCanvas(fig, "상자 속에서 움직이는 기체 분자들");
        function upd() {
          var U = s.N / 20 * s.T / 300;
          tiles(out, [{ n: "분자 수 N", v: s.N + "개" }, "×", { n: "분자 1개의 평균 운동 에너지", v: (s.T / 300).toFixed(1) + "배" }, "=",
            { n: "내부 에너지 U", v: U.toFixed(1) + "배", key: true, c: "inner", bar: U / 4 }],
            "분자 20개, 300 K 일 때를 1배로 놓은 값. 상자의 부피를 바꿔도 내부 에너지는 변하지 않는다.");
        }
        slider(ctl, "절대 온도", 150, 600, 10, 300, function (v) { return v + " K"; }, function (v) { s.T = v; upd(); });
        slider(ctl, "분자 수", 10, 40, 2, 20, function (v) { return v + "개"; }, function (v) { s.N = v; upd(); });
        slider(ctl, "상자의 부피", 50, 100, 5, 100, function (v) { return v + " %"; }, function (v) { s.V = v / 100; upd(); });
        return function (dt) {
          var f = g.begin(), c = f.c, bw = (f.w - 8) * s.V;
          g.gas(c, 4, 4, bw, f.h - 8, s.T, dt, s.N);
          c.strokeStyle = cssVar("ink"); c.lineWidth = 3; c.strokeRect(4, 4, bw, f.h - 8);
        };
      }
    },
    {
      nm: "열", t: "열과 열평형",
      law: "열: 고온 → 저온",
      core: "열은 온도 차이 때문에 이동하는 에너지이다. 온도가 같아지면 이동이 멈춘다.",
      pts: ["열은 온도가 높은 물체에서 낮은 물체로 이동한다.", "두 물체의 온도가 같아져 열의 이동이 멈춘 상태를 열평형이라고 한다.", "온도는 물체의 상태를 나타내는 값이고, 열은 이동하는 에너지의 양이다. 둘은 다른 것이다."],
      link: "제1법칙에서: 기체가 열을 흡수해도 온도가 오르지 않는 경우(등온 과정)가 있다. 열과 온도를 구분해야 이해할 수 있다.",
      quiz: { q: "80 °C 물체와 20 °C 물체를 접촉시켰다. 열은 언제까지 이동할까?", opts: ["두 물체의 온도가 같아질 때까지", "두 물체가 가진 에너지가 같아질 때까지", "뜨거운 물체가 가진 열이 모두 없어질 때까지"], ans: 0, why: "열은 온도 차이가 있을 때 이동하므로, 두 물체의 온도가 같아지는 열평형에서 이동이 멈춘다." },

      pts: ["점의 위치가 정해지면 압력과 부피가 정해지고, 온도도 함께 정해진다.", "같은 등온선(점선) 위의 점들은 온도가 같다. 오른쪽 위에 있는 등온선일수록 온도가 높다.", "기체의 상태가 변하는 과정은 점이 움직인 경로로 나타난다."],
      link: "제1법칙에서: 경로 아래의 넓이가 기체가 한 일이다. 이제 탐구에서 직접 확인해 보자.",
      quiz: { q: "압력–부피 그래프에서 한 점이 나타내는 것은?", opts: ["기체의 한 상태 (압력, 부피, 온도)", "기체가 한 일", "기체가 흡수한 열"], ans: 0, why: "한 점은 그 순간의 압력·부피·온도, 즉 기체의 상태를 나타낸다. 일은 점 하나가 아니라 경로 아래의 넓이로 나타난다." },
      init: function (fig, ctl, out) {
        var s = { P: 2, V: 2 };
        function X(v) { return 50 + v / 4.5 * 290; } function Y(p) { return 170 - p / 8 * 152; }
        function draw() {
          var k = s.P * s.V, T = 300 * k / 4, d = "", b = "";
          for (var v = Math.max(0.3, k / 8); v <= 4.5; v += 0.05) d += (d ? "L" : "M") + X(v).toFixed(1) + " " + Y(k / v).toFixed(1);
          for (var p = 0; p <= 8; p += 2) b += txt(42, Y(p) + 5, p, "var(--muted)", "end");
          for (var q = 0; q <= 4; q++) b += txt(X(q), 188, q, "var(--muted)", "middle");
          b += '<path d="M50 14V170H340" fill="none" stroke="var(--ink)" stroke-width="2"/>' +
            '<path d="' + d + '" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 5"/>' +
            '<path d="M' + X(0) + ' ' + Y(s.P) + 'H' + X(s.V) + 'V' + Y(0) + '" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="2 4"/>' +
            '<circle cx="' + X(s.V) + '" cy="' + Y(s.P) + '" r="7" fill="var(--accent)"/>' +
            txt(8, 14, "압력 (×10⁵ Pa)", "var(--muted)") + txt(340, 198, "부피 (×10⁻³ m³)", "var(--muted)", "end");
          fig.innerHTML = svg("압력-부피 그래프 위의 한 점과 등온선", b);
          tiles(out, [{ n: "압력 P", v: s.P.toFixed(1) + " ×10⁵ Pa" }, { n: "부피 V", v: s.V.toFixed(1) + " ×10⁻³ m³" }, "→",
            { n: "온도 T", v: Math.round(T) + " K", key: true, bar: T / 2100 }],
            "점선은 이 점을 지나는 등온선이다. P × V 가 같은 점들은 온도가 같다.");
        }
        slider(ctl, "압력", 0.5, 7, 0.5, 2, function (v) { return v.toFixed(1) + " ×10⁵ Pa"; }, function (v) { s.P = v; draw(); });
        slider(ctl, "부피", 0.5, 4, 0.5, 2, function (v) { return v.toFixed(1) + " ×10⁻³ m³"; }, function (v) { s.V = v; draw(); });
      }
    }
  ];

  var cur = 0, solved = [], tick = null;

  function renderSteps() {
    var box = $("steps"); box.textContent = "";
    C.forEach(function (c, i) {
      var b = mk("button", solved[i] ? "done" : ""); b.type = "button"; b.id = "step-" + i;
      b.setAttribute("role", "tab"); b.setAttribute("aria-selected", String(i === cur));
      b.setAttribute("aria-label", (i + 1) + ". " + c.t + (solved[i] ? " (확인 완료)" : ""));
      b.appendChild(mk("span", "n", solved[i] ? "✓" : String(i + 1))); b.appendChild(mk("span", "nm", c.nm));
      b.addEventListener("click", function () { show(i); });
      box.appendChild(b);
    });
  }

  function renderQuiz() {
    var q = C[cur].quiz, box = $("q-opts"), why = $("q-why");
    $("q-text").textContent = "확인 문제. " + q.q; box.textContent = ""; why.textContent = "";
    /* 정답이 늘 같은 자리에 오지 않도록 보기 순서를 개념 번호에 따라 돌린다 */
    var order = q.opts.map(function (_, i) { return (i + cur) % q.opts.length; });
    order.forEach(function (oi) {
      var b = mk("button", "", q.opts[oi]); b.type = "button"; b.id = "opt-" + cur + "-" + oi;
      if (solved[cur] && oi === q.ans) b.className = "right";
      b.addEventListener("click", function () {
        if (oi === q.ans) { solved[cur] = true; renderSteps(); renderQuiz(); }
        else { b.className = "wrong"; why.textContent = "다시 생각해 보세요. 왼쪽 그림을 움직여 보면 도움이 됩니다."; }
      });
      box.appendChild(b);
    });
    if (solved[cur]) why.textContent = "정답입니다. " + q.why;
  }

  function show(i) {
    cur = i; var c = C[i], fig = $("fig"), ctl = $("ctl"), out = $("out"), body = $("c-body");
    fig.textContent = ""; ctl.textContent = ""; out.textContent = ""; body.textContent = "";
    $("h-count").textContent = "개념 " + (i + 1) + " / " + C.length;
    $("h-title").textContent = c.t;
    $("h-law").textContent = c.law;
    $("h-core").textContent = c.core;
    if (c.deriv) {
      var ol = mk("ol", "deriv");
      c.deriv.forEach(function (d) { var li = mk("li"); li.appendChild(mk("span", "say", d[0])); li.appendChild(mk("span", "eq", d[1])); ol.appendChild(li); });
      body.appendChild(ol);
    }
    if (c.pts) { var ul = mk("ul", "pts"); c.pts.forEach(function (p) { ul.appendChild(mk("li", "", p)); }); body.appendChild(ul); }
    $("c-link").textContent = c.link;
    tick = c.init(fig, ctl, out) || null;
    renderSteps(); renderQuiz();
    $("btn-prev").disabled = i === 0;
    $("btn-next").textContent = i === C.length - 1 ? "열역학 제1법칙 탐구 시작 →" : "다음 개념 →";
  }

  $("btn-prev").addEventListener("click", function () { if (cur > 0) { show(cur - 1); window.scrollTo(0, 0); } });
  $("btn-next").addEventListener("click", function () {
    if (cur === C.length - 1) { location.href = "first-law.html"; return; }
    show(cur + 1); window.scrollTo(0, 0);
  });

  var last = 0;
  function frame(ms) { var dt = Math.min(0.05, (ms - last) / 1000 || 0); last = ms; if (tick) tick(dt); requestAnimationFrame(frame); }
  show(0); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
